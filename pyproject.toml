[project]
name = "app"
version = "0.1.0"
description = "Python project template"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--cov=app", "--cov-branch", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
exclude_also = ['if __name__ == "__main__":']
